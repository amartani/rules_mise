# BuildBuddy wraps `bazel` with bazelisk, which injects its own bazelrc (BES,
# RBE, metadata). Read the default Bazel version straight from mise.lock and
# hand it to bazelisk via USE_BAZEL_VERSION; no mise install is needed here.
actions:
  - name: buildbuddy root
    triggers: &triggers
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: &bazel_test |
          # The first [[tools.bazel]] entry is the default from mise.toml.
          version="$(awk '/^\[\[tools\.bazel\]\]$/ {found=1; next} found && /^version = / {gsub(/"/, "", $3); print $3; exit}' "$(git rev-parse --show-toplevel)/mise.lock")"
          if [ -z "$version" ]; then
            echo "No Bazel version found in mise.lock" >&2
            exit 1
          fi
          export USE_BAZEL_VERSION="$version"
          bazel test --config=buildbuddy //...
  - name: buildbuddy e2e/smoke
    triggers: *triggers
    bazel_workspace_dir: e2e/smoke
    steps:
      - run: *bazel_test
  - name: buildbuddy e2e/backends
    triggers: *triggers
    bazel_workspace_dir: e2e/backends
    steps:
      - run: *bazel_test
  - name: buildbuddy e2e/conda
    triggers: *triggers
    bazel_workspace_dir: e2e/conda
    steps:
      - run: *bazel_test
  - name: buildbuddy e2e/conda-env
    triggers: *triggers
    bazel_workspace_dir: e2e/conda-env
    steps:
      - run: *bazel_test
  - name: buildbuddy e2e/conda_multi_version
    triggers: *triggers
    bazel_workspace_dir: e2e/conda_multi_version
    steps:
      - run: *bazel_test
  - name: buildbuddy e2e/conda_opensearch
    triggers: *triggers
    bazel_workspace_dir: e2e/conda_opensearch
    steps:
      - run: *bazel_test
  - name: buildbuddy e2e/conda_redis
    triggers: *triggers
    bazel_workspace_dir: e2e/conda_redis
    steps:
      - run: *bazel_test
  - name: buildbuddy e2e/itest
    triggers: *triggers
    bazel_workspace_dir: e2e/itest
    steps:
      - run: *bazel_test
