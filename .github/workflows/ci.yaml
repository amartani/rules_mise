name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bazel: ["9", "8"]
        folder:
          - .
          - e2e/backends
          - e2e/conda
          - e2e/conda-env
          - e2e/conda_multi_version
          - e2e/conda_opensearch
          - e2e/conda_redis
          - e2e/itest
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    env:
      # mise.toml declares both majors; the first one ("9") is the default.
      MISE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.8
        with:
          cache_key: "{{default}}-bazel${{ matrix.bazel }}"
      # setup-bazel also cached Bazel's disk/repository caches; mise-action only
      # caches the Bazel binaries, so restore those two caches explicitly.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-CI-${{ hashFiles('**/MODULE.bazel', '**/BUILD', '**/BUILD.bazel', 'mise.lock') }}
          restore-keys: bazel-disk-${{ runner.os }}-${{ runner.arch }}-CI-
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/MODULE.bazel', '**/MODULE.bazel.lock', '**/WORKSPACE', '**/WORKSPACE.bazel', '**/WORKSPACE.bzlmod', 'mise.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure Bazel caches
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/bazel-disk" "$HOME/.cache/bazel-repo"
          {
            echo "build --disk_cache=$HOME/.cache/bazel-disk"
            echo "common --repository_cache=$HOME/.cache/bazel-repo"
          } >> "$HOME/.bazelrc"
      - name: Test
        run: |
          args=(test //...)
          if [[ "${{ matrix.folder }}" == "." ]]; then
            args+=(--config=ci)
            if [[ "${{ matrix.bazel }}" == "8" ]]; then
              # The lockfile is generated with the newest Bazel; older
              # versions need a different lockfile format.
              args+=(--lockfile_mode=update)
            fi
          fi
          mise exec -- bazel "${args[@]}"
  smoke:
    # e2e/smoke is the BCR presubmit module: run it on every OS x arch so
    # platform-specific tool failures surface here instead of at publish time.
    # Runner labels are the standard GitHub-hosted ones (free for public repos):
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    # Pinned versions (not -latest) to avoid surprise image migrations.
    strategy:
      fail-fast: false
      matrix:
        bazel: ["9", "8"]
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            disk_cache: ~/.cache/bazel-disk
            repo_cache: ~/.cache/bazel-repo
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            disk_cache: ~/.cache/bazel-disk
            repo_cache: ~/.cache/bazel-repo
          - name: macos-arm64
            runner: macos-15
            disk_cache: ~/Library/Caches/bazel-disk
            repo_cache: ~/Library/Caches/bazel-repo
          - name: macos-x86_64
            runner: macos-15-intel
            disk_cache: ~/Library/Caches/bazel-disk
            repo_cache: ~/Library/Caches/bazel-repo
          - name: windows-x86_64
            runner: windows-2025
            disk_cache: C:/_bazel-disk
            repo_cache: C:/_bazel-repo
            # No windows-arm64: ruff ships no Windows aarch64 binary upstream,
            # so the smoke toolset cannot cover that platform.
    name: smoke (${{ matrix.platform.name }}, bazel ${{ matrix.bazel }})
    runs-on: ${{ matrix.platform.runner }}
    defaults:
      run:
        working-directory: e2e/smoke
    env:
      MISE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.8
        with:
          cache_key: "{{default}}-bazel${{ matrix.bazel }}"
      # Same Bazel-side caches setup-bazel used to manage on every platform.
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ matrix.platform.disk_cache }}
          key: bazel-disk-${{ matrix.platform.name }}-CI-${{ hashFiles('**/MODULE.bazel', '**/BUILD', '**/BUILD.bazel', 'mise.lock') }}
          restore-keys: bazel-disk-${{ matrix.platform.name }}-CI-
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ matrix.platform.repo_cache }}
          key: bazel-repo-${{ matrix.platform.name }}-${{ hashFiles('**/MODULE.bazel', '**/MODULE.bazel.lock', '**/WORKSPACE', '**/WORKSPACE.bazel', '**/WORKSPACE.bzlmod', 'mise.lock') }}
          restore-keys: bazel-repo-${{ matrix.platform.name }}-
      - name: Configure Bazel caches
        shell: bash
        run: |
          mkdir -p "${{ matrix.platform.disk_cache }}" "${{ matrix.platform.repo_cache }}"
          {
            echo "build --disk_cache=${{ matrix.platform.disk_cache }}"
            echo "common --repository_cache=${{ matrix.platform.repo_cache }}"
          } >> "$HOME/.bazelrc"
      - run: mise exec -- bazel test //...
  hk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.8
      - run: mise exec -- hk check --all
  actions-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: gh extension install github/gh-actions-lock
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
  # For branch protection settings, this job provides a "stable" name that can be used to gate PR merges
  # on "all matrix jobs were successful".
  conclusion:
    needs: [test, smoke, hk, actions-lock]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: read
    steps:
      - uses: technote-space/workflow-conclusion-action@v3.0.3
      # Note: possible conclusion values:
      # https://github.com/technote-space/workflow-conclusion-action/blob/main/src/constant.ts
      - name: report success
        if: ${{ env.WORKFLOW_CONCLUSION == 'success' }}
        working-directory: /tmp
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 0
      - name: report failure
        if: ${{ env.WORKFLOW_CONCLUSION == 'failure' }}
        working-directory: /tmp
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 1
