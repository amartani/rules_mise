[tools]
# First version is the default (`mise exec -- bazel`); both are available in CI
# via the matrix and `MISE_BAZEL_VERSION`.
bazel = ["9", "8"]
buildifier = "latest"
"aqua:bazelbuild/buildtools/buildozer" = "latest"
hk = "latest"
"npm:renovate" = { version = "latest", trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }
rumdl = "latest"
taplo = "latest"
typos = "latest"
yamlfmt = "latest"
